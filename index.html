<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Checkers</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=5">

    <link rel="stylesheet" media="screen" href="stylesheets/main.min.css">
    <link rel="shortcut icon" type="image/png" href="images/favicon.png">

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-width: 0;
            min-height: 100%;
            background: #000 !important;
            overflow-x: hidden;
        }

        body {
            visibility: hidden;
        }

        body.page-ready {
            visibility: visible;
        }

        #game-layout {
            position: relative;
            display: block;
            width: 100%;
            min-width: 0;
            min-height: 100vh;
            overflow: visible;
        }

        #game-scale-wrapper {
            position: relative;
            display: block;
            width: 100%;
            min-width: 0;
            margin: 0 auto;
            padding: 0;
            overflow: visible;
            transform-origin: top left;
            box-sizing: border-box;
        }

        #root {
            position: relative;
            display: block;
            width: 100%;
            min-width: 0;
            margin: 0;
            padding: 0;
            overflow: visible;
            box-sizing: border-box;
        }

        .site-footer {
            position: relative;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        #dialog-root {
            position: relative;
            width: 100%;
            min-width: 0;
            box-sizing: border-box;
        }

        #customer-service {
            position: fixed;
            z-index: 2147483647;
            right: 18px;
            bottom: 18px;
            width: 300px;
            max-width: calc(100vw - 36px);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            pointer-events: none;
        }

        .customer-ad-card {
            position: relative;
            width: 100%;
            box-sizing: border-box;
            padding: 17px 17px 15px;
            border-radius: 16px;
            background: rgba(18, 18, 18, 0.82);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.58),
                0 3px 12px rgba(0, 0, 0, 0.38);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            pointer-events: auto;
            transform-origin: bottom right;
            animation: customer-ad-enter 0.4s cubic-bezier(.2, .8, .2, 1) both;
        }

        .customer-ad-card::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #00c853, #00e676, #69f0ae);
        }

        .customer-ad-glow {
            position: absolute;
            width: 110px;
            height: 110px;
            right: -55px;
            top: -55px;
            border-radius: 50%;
            background: rgba(0, 230, 118, 0.08);
            filter: blur(4px);
            pointer-events: none;
        }

        .customer-ad-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 34px;
            height: 34px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.07);
            color: rgba(255, 255, 255, 0.68);
            font-size: 25px;
            line-height: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .customer-ad-close:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
            transform: rotate(90deg);
        }

        .customer-ad-header {
            display: flex;
            align-items: center;
            gap: 11px;
            padding-right: 35px;
        }

        .customer-service-icon {
            position: relative;
            flex: 0 0 auto;
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #00e676, #00a844);
            box-shadow: 0 6px 18px rgba(0, 230, 118, 0.2);
        }

        .customer-service-icon svg {
            width: 28px;
            height: 28px;
            fill: #fff;
        }

        .customer-online {
            position: absolute;
            right: -2px;
            bottom: -2px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #00e676;
            border: 2px solid #111;
            box-sizing: border-box;
        }

        .customer-ad-title {
            margin: 0;
            color: #fff;
            font-size: 17px;
            font-weight: 700;
            line-height: 1.25;
        }

        .customer-ad-status {
            margin-top: 4px;
            color: #00e676;
            font-size: 11px;
            font-weight: 600;
        }

        .customer-ad-description {
            margin: 13px 0 14px;
            color: rgba(255, 255, 255, 0.68);
            font-size: 12px;
            line-height: 1.5;
        }

        .customer-ad-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            width: 100%;
            min-height: 43px;
            box-sizing: border-box;
            padding: 0 14px;
            border-radius: 11px;
            background: linear-gradient(135deg, #00e6766b, #00c829ed);
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 6px 18px rgba(0, 200, 83, 0.22);
            transition: all 0.2s ease;
        }

        .customer-ad-button:hover {
            transform: translateY(-1px);
            filter: brightness(1.06);
            box-shadow: 0 9px 22px rgba(0, 200, 83, 0.3);
        }

        .customer-ad-button:active {
            transform: translateY(0);
        }

        .customer-ad-button svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        .customer-ad-footer {
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 9px;
            text-align: center;
        }

        .customer-floating-button {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 62px;
            height: 62px;
            border: 0;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #00e676, #00a844);
            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.58),
                0 4px 15px rgba(0, 200, 83, 0.3);
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s ease;
        }

        .customer-floating-button:hover {
            transform: scale(1.06);
        }

        .customer-floating-button svg {
            width: 31px;
            height: 31px;
            fill: #fff;
        }

        .customer-floating-button::after {
            content: "";
            position: absolute;
            right: 1px;
            bottom: 1px;
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #00e676;
            border: 2px solid #000;
            box-sizing: border-box;
        }

        #customer-service.is-closed .customer-ad-card {
            display: none;
        }

        #customer-service.is-closed .customer-floating-button {
            display: flex;
        }

        @keyframes customer-ad-enter {
            0% {
                opacity: 0;
                transform: translateY(18px) scale(0.92);
            }

            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 600px) {

            #game-layout {
                width: 100%;
                min-width: 0;
                min-height: 100vh;
				margin-top: 10px;
            }

            #game-scale-wrapper {
                transform-origin: top left;
            }

            #customer-service {
                right: 30px;
                top: 400px;
                width: 270px;
                max-width: calc(100vw - 20px);
            }

            .customer-ad-card {
                padding: 14px 14px 12px;
                border-radius: 14px;
            }

            .customer-service-icon {
                width: 42px;
                height: 42px;
                border-radius: 11px;
            }

            .customer-service-icon svg {
                width: 24px;
                height: 24px;
            }

            .customer-ad-title {
                font-size: 15px;
            }

            .customer-ad-status {
                font-size: 27px;
            }

            .customer-ad-description {
                margin: 10px 0 11px;
                font-size: 11px;
            }

            .customer-ad-button {
                min-height: 39px;
                font-size: 11px;
            }

            .customer-ad-footer {
                margin-top: 12px;
                font-size: 8px;
            }

            .customer-floating-button {
                width: 57px;
                height: 57px;
            }

            .customer-floating-button svg {
                width: 28px;
                height: 28px;
            }
        }

        @media (max-width: 360px) {

            #customer-service {
                right: 8px;
                bottom: 8px;
                max-width: calc(100vw - 16px);
            }

            .customer-ad-card {
                padding: 13px 12px 11px;
            }

            .customer-ad-title {
                font-size: 14px;
            }

            .customer-ad-description {
                font-size: 12px;
            }

            .customer-ad-button {
                min-height: 37px;
                font-size: 11px;
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .customer-ad-card {
                animation: none;
            }

            .customer-ad-button,
            .customer-floating-button,
            .customer-ad-close {
                transition: none;
            }
        }
    </style>
</head>

    <script>
        (() => {

            const observer = new MutationObserver(() => {

                document.querySelectorAll(
                    'g[transform="translate(406,56)"]'
                ).forEach(el => {

                    el.setAttribute(
                        'transform',
                        'translate(0,460)'
                    );

                });

                document.querySelectorAll(
                    'g[transform="translate(0,56)"]'
                ).forEach(el => {

                    el.setAttribute(
                        'transform',
                        'translate(0,55)'
                    );

                });

                document.querySelectorAll(
                    'g[transform="translate(10,204)"]'
                ).forEach(el => {

                    el.setAttribute(
                        'transform',
                        'translate(10,165)'
                    );

                });

            });

            observer.observe(document.body, {
                subtree: true,
                attributes: true,
                attributeFilter: [
                    'transform'
                ],
                childList: true
            });

            requestAnimationFrame(() => {

                requestAnimationFrame(() => {

                    document.body.classList.add(
                        'page-ready'
                    );

                });

            });

        })();

    <script>
        (() => {

            const customerService =
                document.getElementById(
                    "customer-service"
                );

            const closeButton =
                document.getElementById(
                    "customer-ad-close"
                );

            const floatingButton =
                document.getElementById(
                    "customer-floating-button"
                );

            const serviceLink =
                document.getElementById(
                    "customer-service-link"
                );

            closeButton.addEventListener(
                "click",
                () => {

                    customerService.classList.add(
                        "is-closed"
                    );

                }
            );

            floatingButton.addEventListener(
                "click",
                () => {

                    customerService.classList.remove(
                        "is-closed"
                    );

                }
            );

        })();
    </script>

    <script>
        (() => {

            if (screen.width >= screen.height) {
            	return;
            }

            const wrapper =
                document.getElementById(
                    "game-scale-wrapper"
                );

            const gameLayout =
                document.getElementById(
                    "game-layout"
                );

            const root =
                document.getElementById(
                    "root"
                );

            if (
                !wrapper ||
                !gameLayout ||
                !root
            ) {
                return;
            }

            let resizeTimer = null;

            let lastWidth = 0;

            let lastHeight = 0;

            let lastScale = 1;

            const WIDTH_MARGIN = 4;

            const HEIGHT_MARGIN = 16;

            const MIN_SCALE = 0.5;

            function viewportWidth() {

                const visualViewport =
                    window.visualViewport;

                if (
                    visualViewport &&
                    visualViewport.width
                ) {

                    return visualViewport.width;

                }

                return Math.max(
                    document.documentElement.clientWidth || 0,
                    window.innerWidth || 0
                );

            }

            function viewportHeight() {

                const visualViewport =
                    window.visualViewport;

                if (
                    visualViewport &&
                    visualViewport.height
                ) {

                    return visualViewport.height;

                }

                return Math.max(
                    document.documentElement.clientHeight || 0,
                    window.innerHeight || 0
                );

            }

            function resetLayout() {

                wrapper.style.transform =
                    "none";

                wrapper.style.transformOrigin =
                    "top left";

                wrapper.style.width =
                    "100%";

                wrapper.style.height =
                    "auto";

                wrapper.style.marginLeft =
                    "0";

                wrapper.style.marginRight =
                    "0";

                gameLayout.style.height =
                    "auto";

            }

            function getRect(el) {

                try {

                    return el.getBoundingClientRect();

                } catch (e) {

                    return null;

                }

            }

            function collectVisualElements() {

                const elements = [];

                elements.push(root);

                root.querySelectorAll(
                    "svg, canvas, img, video, iframe, table"
                ).forEach(el => {

                    elements.push(el);

                });

                return elements;

            }

            function getVisualBounds() {

                const elements =
                    collectVisualElements();

                let minLeft = Infinity;

                let minTop = Infinity;

                let maxRight = -Infinity;

                let maxBottom = -Infinity;

                elements.forEach(el => {

                    const rect =
                        getRect(el);

                    if (!rect) {
                        return;
                    }

                    if (
                        rect.width <= 0 ||
                        rect.height <= 0
                    ) {
                        return;
                    }

                    minLeft =
                        Math.min(
                            minLeft,
                            rect.left
                        );

                    minTop =
                        Math.min(
                            minTop,
                            rect.top
                        );

                    maxRight =
                        Math.max(
                            maxRight,
                            rect.right
                        );

                    maxBottom =
                        Math.max(
                            maxBottom,
                            rect.bottom
                        );

                });

                const rootRect =
                    getRect(root);

                if (
                    rootRect &&
                    rootRect.width > 0 &&
                    rootRect.height > 0
                ) {

                    minLeft =
                        Math.min(
                            minLeft,
                            rootRect.left
                        );

                    minTop =
                        Math.min(
                            minTop,
                            rootRect.top
                        );

                    maxRight =
                        Math.max(
                            maxRight,
                            rootRect.right
                        );

                    maxBottom =
                        Math.max(
                            maxBottom,
                            rootRect.bottom
                        );

                }

                if (
                    !isFinite(minLeft) ||
                    !isFinite(minTop) ||
                    !isFinite(maxRight) ||
                    !isFinite(maxBottom)
                ) {

                    return null;

                }

                return {

                    left: minLeft,

                    top: minTop,

                    right: maxRight,

                    bottom: maxBottom,

                    width:
                        Math.max(
                            0,
                            maxRight - minLeft
                        ),

                    height:
                        Math.max(
                            0,
                            maxBottom - minTop
                        )

                };

            }

            function getLayoutSize() {

                const rect =
                    getRect(root);

                const scrollWidth =
                    root.scrollWidth || 0;

                const scrollHeight =
                    root.scrollHeight || 0;

                const offsetWidth =
                    root.offsetWidth || 0;

                const offsetHeight =
                    root.offsetHeight || 0;

                return {

                    width:
                        Math.max(
                            rect ? rect.width : 0,
                            scrollWidth,
                            offsetWidth
                        ),

                    height:
                        Math.max(
                            rect ? rect.height : 0,
                            scrollHeight,
                            offsetHeight
                        )

                };

            }

            function calculate() {

                resetLayout();

                const vw =
                    viewportWidth();

                const vh =
                    viewportHeight();

                if (
                    !vw ||
                    !vh
                ) {
                    return;
                }

                const visualBounds =
                    getVisualBounds();

                const layoutSize =
                    getLayoutSize();

                let contentWidth =
                    layoutSize.width;

                let contentHeight =
                    layoutSize.height;

                if (visualBounds) {

                    contentWidth =
                        Math.max(
                            contentWidth,
                            visualBounds.width
                        );

                    contentHeight =
                        Math.max(
                            contentHeight,
                            visualBounds.height
                        );

                }

                if (
                    !contentWidth ||
                    contentWidth <= 0
                ) {

                    contentWidth = vw;

                }

                if (
                    !contentHeight ||
                    contentHeight <= 0
                ) {

                    contentHeight = vh;

                }

                const availableWidth =
                    Math.max(
                        1,
                        vw - WIDTH_MARGIN
                    );

                const availableHeight =
                    Math.max(
                        1,
                        vh - HEIGHT_MARGIN
                    );

                const widthScale =
                    availableWidth /
                    contentWidth;

                const heightScale =
                    availableHeight /
                    contentHeight;

                let scale =
                    Math.min(
                        1,
                        widthScale,
                        heightScale
                    );

                if (
                    !isFinite(scale) ||
                    scale <= 0
                ) {

                    scale = 1;

                }

                scale =
                    Math.max(
                        MIN_SCALE,
                        Math.min(
                            1,
                            scale
                        )
                    );

                const scaledWidth =
                    contentWidth * scale;

                const scaledHeight =
                    contentHeight * scale;

                const left =
                    Math.max(
                        0,
                        (vw - scaledWidth) / 2
                    );

                wrapper.style.width =
                    contentWidth + "px";

                wrapper.style.height =
                    contentHeight + "px";

                wrapper.style.marginLeft =
                    left + "px";

                wrapper.style.marginRight =
                    "0";

                wrapper.style.transformOrigin =
                    "top left";

                wrapper.style.transform =
                    "scale(" + scale + ")";

                gameLayout.style.height =
                    Math.ceil(
                        scaledHeight +
                        HEIGHT_MARGIN
                    ) + "px";

                lastWidth = vw;

                lastHeight = vh;

                lastScale = scale;

            }

            function scheduleResize(delay = 60) {

                clearTimeout(
                    resizeTimer
                );

                resizeTimer =
                    setTimeout(() => {

                        requestAnimationFrame(() => {

                            requestAnimationFrame(() => {

                                calculate();

                            });

                        });

                    }, delay);

            }

            const resizeObserver =
                new ResizeObserver(() => {

                    scheduleResize();

                });

            resizeObserver.observe(root);

            const mutationObserver =
                new MutationObserver(() => {

                    scheduleResize(80);

                });

            mutationObserver.observe(
                root,
                {
                    childList: true,
                    subtree: true,
                    attributes: true,
                    attributeFilter: [
                        "width",
                        "height",
                        "viewBox",
                        "transform",
                        "style",
                        "class"
                    ]
                }
            );

            window.addEventListener(
                "resize",
                () => {

                    scheduleResize(80);

                },
                {
                    passive: true
                }
            );

            window.addEventListener(
                "orientationchange",
                () => {

                    setTimeout(
                        () => scheduleResize(0),
                        100
                    );

                    setTimeout(
                        () => scheduleResize(0),
                        300
                    );

                    setTimeout(
                        () => scheduleResize(0),
                        700
                    );

                    setTimeout(
                        () => scheduleResize(0),
                        1200
                    );

                },
                {
                    passive: true
                }
            );

            if (window.visualViewport) {

                window.visualViewport.addEventListener(
                    "resize",
                    () => {

                        scheduleResize(100);

                    },
                    {
                        passive: true
                    }
                );

                window.visualViewport.addEventListener(
                    "scroll",
                    () => {

                        scheduleResize(100);

                    },
                    {
                        passive: true
                    }
                );

            }

            window.addEventListener(
                "load",
                () => {

                    scheduleResize(0);

                    setTimeout(
                        () => scheduleResize(0),
                        100
                    );

                    setTimeout(
                        () => scheduleResize(0),
                        300
                    );

                    setTimeout(
                        () => scheduleResize(0),
                        600
                    );

                    setTimeout(
                        () => scheduleResize(0),
                        1000
                    );

                    setTimeout(
                        () => scheduleResize(0),
                        1600
                    );

                    setTimeout(
                        () => scheduleResize(0),
                        2500
                    );

                }
            );

            if (document.fonts) {

                document.fonts.ready.then(() => {

                    scheduleResize(0);

                });

            }

            if (
                "ResizeObserver" in window
            ) {

                scheduleResize(0);

            } else {

                setTimeout(
                    () => calculate(),
                    100
                );

            }

        })();
    </script>

</body>
</html>
